name: Build Android APK From ZIP
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip Project
        run: |
          unzip my-app.zip -d extracted_project
          # প্রজেক্টের আসল ডিরেক্টরি খুঁজে বের করা
          BUILD_GRADLE_PATH=$(find extracted_project -name "build.gradle*" | head -n 1)
          PROJECT_DIR=$(dirname "$BUILD_GRADLE_PATH")
          
          # যদি app ফোল্ডারের ভেতরের build.gradle খুঁজে পায়, তবে এক ধাপ পেছনে মেইন প্রজেক্টে যাওয়া
          if [[ "$PROJECT_DIR" == */app ]]; then
            PROJECT_DIR=$(dirname "$PROJECT_DIR")
          fi
          
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          cd "$PROJECT_DIR"
          
          # যদি gradlew ফাইল না থাকে, তবে গিটহাব নিজেই নতুন করে তৈরি করে নেবে
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
